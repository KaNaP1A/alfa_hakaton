services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: alfa
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../02_data/raw:/input:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No public database port: access via docker compose exec.
volumes:
  pgdata:
