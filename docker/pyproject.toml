[project]
name = "alfa-demo-runtime"
version = "0.1.0"
description = "Locked dependencies for the containerised Alfa demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.121.2",
  "uvicorn==0.38.0",
  "SQLAlchemy==2.0.44",
  "psycopg[binary]==3.2.12",
  "httpx==0.28.1",
  "numpy==2.4.4",
  "sentence-transformers==5.4.1",
  "transformers==5.8.0",
  "torch==2.11.0",
  "catboost==1.2.8",
  "pymorphy3==2.0.6",
  "pymorphy3-dicts-ru==2.4.417150.4580142",
  "dawg2-python==0.9.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
