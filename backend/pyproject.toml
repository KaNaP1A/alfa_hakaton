[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "alfa-hackathon-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.121.2",
  "uvicorn==0.38.0",
  "SQLAlchemy==2.0.44",
  "psycopg[binary]==3.2.12",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["ruff==0.14.5", "mypy==2.4.1"]

[project.scripts]
alfa-backend = "cli:main"

[tool.setuptools.packages.find]
include = ["api*", "domain*", "services*", "repositories*", "infrastructure*", "config*", "schemas*"]

[tool.setuptools]
py-modules = ["app", "cli"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
files = ["app.py", "cli.py", "config", "schemas", "api", "domain", "services", "repositories", "infrastructure", "scripts"]
