services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: alfa_api
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - api_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_api"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      ALFA_DATABASE_URL: postgresql+psycopg://alfa:${POSTGRES_PASSWORD}@db:5432/alfa_api
      ALFA_CORS_ORIGINS: ${ALFA_CORS_ORIGINS:-}
      ALFA_RECO_MODE: ${ALFA_RECO_MODE:-demo}
      ALFA_RECO_URL: ${ALFA_RECO_URL:-http://host.docker.internal:8000}
      ALFA_RECO_HOST_HEADER: ${ALFA_RECO_HOST_HEADER:-}
      ALFA_RECO_TIMEOUT: ${ALFA_RECO_TIMEOUT:-30}
      ALFA_RATE_LIMIT: ${ALFA_RATE_LIMIT:-120}
      ALFA_TOKEN_TTL: ${ALFA_TOKEN_TTL:-86400}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      db:
        condition: service_healthy
volumes:
  api_pgdata:
