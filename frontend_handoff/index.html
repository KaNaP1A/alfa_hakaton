<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пример подключения рекомендаций</title></head>
<body>
  <h1>Проверка подключения интерфейса</h1>
  <p>Только вымышленные данные. Это технический пример для фронтендера, а не сайт и не настоящий алгоритм.</p>
  <form id="search"><label>Запрос <input name="q" maxlength="300" required value="Управление командой"></label> <button>Найти</button></form>
  <p>Для пустого ответа введите «пусто». Для проверки уточнения введите «уточнение».</p>
  <p id="status" role="status"></p><section id="results"></section>
  <script src="/app.js" defer></script>
</body>
</html>
